spring.application.name=codemind-server
server.port=${CODEMIND_SERVER_PORT:8080}

codemind.agent.base-url=${CODEMIND_AGENT_BASE_URL:http://127.0.0.1:8001}

spring.datasource.url=${CODEMIND_DB_URL:jdbc:postgresql://localhost:15432/codemind}
spring.datasource.username=${CODEMIND_DB_USERNAME:codemind}
spring.datasource.password=${CODEMIND_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Existing P0 core schema baseline
spring.flyway.out-of-order=false

codemind.security.jwt-secret=${CODEMIND_JWT_SECRET}
codemind.security.access-token-minutes=${CODEMIND_ACCESS_TOKEN_MINUTES:480}
spring.jpa.open-in-view=false

logging.level.org.hibernate.SQL=warn
logging.level.org.hibernate.orm.jdbc.bind=warn
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=warn

# Requirement Agent persistent worker
codemind.agent.worker.enabled=true
codemind.agent.worker.queue-name=requirement-agent
codemind.agent.worker.poll-delay-ms=2000
codemind.agent.worker.max-acquire-per-poll=2
codemind.agent.worker.lock-seconds=900
codemind.agent.worker.heartbeat-seconds=30
codemind.agent.worker.retry-base-seconds=30
codemind.agent.worker.retry-max-seconds=900

# Idle backoff
codemind.agent.worker.idle-backoff-enabled=true
codemind.agent.worker.idle-backoff-threshold=5
codemind.agent.worker.idle-backoff-max-skip=15

# Same module serial execution policy
codemind.agent.worker.module-serial-execution-enabled=true
codemind.agent.worker.module-busy-retry-seconds=20

# Dependency auto unblock sweeper
codemind.agent.worker.dependency-auto-unblock-enabled=true
codemind.agent.worker.dependency-blocked-scan-batch-size=50
codemind.agent.worker.dependency-unblock-sweeper-delay-ms=30000

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
server.tomcat.max-swallow-size=20MB
codemind.assistant.attachments.max-size-bytes=${CODEMIND_ASSISTANT_ATTACHMENTS_MAX_SIZE_BYTES:20971520}
codemind.assistant.attachments.storage-root=${CODEMIND_ASSISTANT_ATTACHMENTS_ROOT}