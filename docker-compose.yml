services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: codemind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: codemind
      POSTGRES_USER: codemind
      POSTGRES_PASSWORD: codemind123
      TZ: Asia/Shanghai
    ports:
      - "15432:5432"
    volumes:
      - codemind_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codemind -d codemind"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - codemind-net

  redis:
    image: redis:7
    container_name: codemind-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - codemind_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - codemind-net

  minio:
    image: minio/minio:latest
    container_name: codemind-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: codemind
      MINIO_ROOT_PASSWORD: codemind123
      TZ: Asia/Shanghai
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - codemind_minio_data:/data
    networks:
      - codemind-net

  minio-init:
    image: minio/mc:latest
    container_name: codemind-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set codemind http://minio:9000 codemind codemind123;
      mc mb -p codemind/codemind-files || true;
      mc mb -p codemind/codemind-artifacts || true;
      mc mb -p codemind/codemind-exports || true;
      exit 0;
      "
    networks:
      - codemind-net

volumes:
  codemind_pg_data:
  codemind_redis_data:
  codemind_minio_data:

networks:
  codemind-net:
    driver: bridge